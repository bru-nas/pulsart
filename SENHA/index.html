<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="/email-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#000;color:#e9dcc3;font-family:Jost,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.c{width:100%;max-width:420px;text-align:center}.c img{width:120px;height:auto;margin-bottom:8px}
.k{font-size:.72rem;letter-spacing:.32em;color:#c9a063;text-transform:uppercase;margin:0 0 28px}
h1{font-weight:400;font-size:1.5rem;margin:0 0 10px;color:#f3d9a4}p{color:#a99a7c;line-height:1.55;margin:0 0 22px}
label{display:block;text-align:left;font-size:.8rem;letter-spacing:.08em;color:#cdbb97;margin:14px 0 6px}
input{width:100%;background:#000;color:#e9dcc3;border:1px solid #3a2f1c;border-radius:10px;padding:15px 16px;font:inherit;font-size:1.05rem}
input:focus{outline:none;border-color:#c9a063;box-shadow:0 0 0 3px rgba(201,160,99,.18)}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:10px;background:linear-gradient(135deg,#f3d9a4,#c9a063);color:#000;font:500 1rem Jost,Arial,sans-serif;letter-spacing:.06em;cursor:pointer}
button:disabled{opacity:.6}.m{margin-top:16px;font-size:.92rem;min-height:1.2em}.e{color:#e08a7a}.o{color:#f3d9a4}
.f{margin-top:34px;font-size:.7rem;letter-spacing:.2em;color:#8c7a58}
</style></head><body><div class="c">
<img src="/email-logo.png" alt="PULSART"><p class="k">Tecnologia e criatividade</p>
<div id="v1"><h1>Esqueci minha senha</h1><p>Digite o e-mail cadastrado no seu painel. Se ele estiver na PULSART, você recebe um link para criar uma nova senha.</p>
<label for="em">Seu e-mail</label><input id="em" type="email" autocomplete="email" maxlength="120" placeholder="voce@exemplo.com">
<button id="b1">Enviar link</button></div>
<div id="v2" hidden><h1>Nova senha</h1><p>Escolha a senha que só você vai usar no painel do seu site.</p>
<label for="s1">Nova senha</label><input id="s1" type="password" autocomplete="new-password" maxlength="100">
<label for="s2">Repita a senha</label><input id="s2" type="password" autocomplete="new-password" maxlength="100">
<button id="b2">Salvar nova senha</button></div>
<div class="m" id="m"></div><div class="f">PULSART</div></div>
<script>
var API="https://pulsart-senha.miztella.workers.dev",$=function(i){return document.getElementById(i)},q=new URLSearchParams(location.search),A=q.get("a")||"",R=q.get("r")||"";
function msg(t,ok){var m=$("m");m.textContent=t;m.className="m "+(ok?"o":"e")}
function post(p,b){return fetch(API+p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j.s=r.status;return j})})}
if(A&&R){$("v1").hidden=true;$("v2").hidden=false}
$("b1").onclick=function(){var e=$("em").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){msg("Digite um e-mail válido.");return}
 var b=this;b.disabled=true;msg("");post("/pedir",{email:e}).then(function(j){b.disabled=false;if(j.ok)msg("Pronto! Se esse e-mail estiver cadastrado, o link chega em instantes. Olhe também o spam.",1);else msg("Não deu certo. Tente de novo em alguns minutos.")}).catch(function(){b.disabled=false;msg("Sem conexão. Tente de novo.")})};
$("b2").onclick=function(){var s=$("s1").value;if(s.length<6){msg("Use pelo menos 6 caracteres.");return}if(s!==$("s2").value){msg("As senhas não conferem.");return}
 var b=this;b.disabled=true;msg("");post("/trocar",{a:A,r:R,senha:s}).then(function(j){b.disabled=false;if(j.ok){$("v2").hidden=true;msg("Senha alterada! Volte ao seu site e entre com a nova senha.",1)}else if(j.erro==="link")msg("Link inválido ou vencido. Peça um novo.");else msg("Não deu certo. Tente de novo.")}).catch(function(){b.disabled=false;msg("Sem conexão. Tente de novo.")})};
</script></body></html>
