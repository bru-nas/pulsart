<style>
:root{--g1:#f3d9a4;--g2:#c9a063;--g3:#8c6a36;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:#e9dcc3;font-family:'Jost',system-ui,sans-serif;overflow-x:hidden;display:flex;flex-direction:column;min-height:100svh}
.curves{position:fixed;inset:0;pointer-events:none;z-index:0}
.curves svg{width:100%;height:100%}
.curves path{fill:none;stroke:url(#gg);stroke-width:1.2;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:sh 7s ease-in-out infinite}
.curves path:nth-child(2){animation-delay:-2s;stroke-width:.8;opacity:.7}
.curves path:nth-child(3){animation-delay:-4s}
.curves path:nth-child(4){animation-delay:-5s;stroke-width:.8;opacity:.7}
@keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 20px}
.symwrap{position:relative;width:min(376px,80vw);margin-bottom:6px;display:grid;place-items:center}
.symwrap:before,.symwrap:after{content:"";position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;margin:-31% 0 0 -31%;border-radius:50%;border:1px solid rgba(243,217,164,.55);opacity:0;pointer-events:none;animation:none;display:none}
.symwrap:after{animation-delay:1.35s}
@keyframes ring{0%{transform:scale(.5);opacity:.7}100%{transform:scale(3);opacity:0}}
.symbox{position:relative;width:100%}.symbox .lg0{display:block;width:100%;height:auto}.symbox svg{display:block;width:100%;height:auto;overflow:visible}#dr{position:absolute;left:0;top:0;pointer-events:none}@keyframes beat{0%,100%{transform:scale(1);filter:brightness(1)}14%{transform:scale(1.08);filter:brightness(1.45)}28%{transform:scale(1);filter:brightness(1.05)}42%{transform:scale(1.045);filter:brightness(1.25)}58%{transform:scale(1);filter:brightness(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(243,217,164,0))}14%{filter:drop-shadow(0 0 16px rgba(243,217,164,.6))}28%{filter:drop-shadow(0 0 3px rgba(243,217,164,.15))}42%{filter:drop-shadow(0 0 10px rgba(243,217,164,.4))}58%{filter:drop-shadow(0 0 0 rgba(243,217,164,0))}}
.word{font-weight:300;font-size:clamp(2.2rem,10.4vw,5.8rem);letter-spacing:.34em;padding-left:.34em;line-height:1;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:in 1.1s .15s forwards;white-space:nowrap}
.a{display:inline-block;width:.74em;height:.72em;vertical-align:baseline;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));clip-path:polygon(50% 0,100% 100%,91.5% 100%,50% 13%,8.5% 100%,0 100%);margin:0 .02em}
.tag{margin-top:18px;font-weight:300;font-size:clamp(.62rem,2.4vw,1.05rem);letter-spacing:.5em;padding-left:.5em;color:var(--g2);text-transform:uppercase;opacity:0;animation:in 1.1s .45s forwards}
.line{width:min(340px,60vw);height:1px;margin:34px auto 22px;background:linear-gradient(90deg,transparent,var(--g2),transparent);opacity:0;animation:in 1.1s .65s forwards}
.soon{font-weight:300;font-size:.82rem;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#cdbb97;opacity:0;animation:in 1.1s .8s forwards}
.sub{margin-top:12px;max-width:440px;font-weight:300;font-size:.98rem;line-height:1.7;color:#a99a7c;opacity:0;animation:in 1.1s .95s forwards}
@keyframes in{to{opacity:1}}
footer{position:relative;z-index:2;text-align:center;padding:22px 16px 28px;font-weight:300;font-size:.68rem;letter-spacing:.34em;color:#8c7a58;text-transform:uppercase}
footer i{font-style:normal;margin:0 .6em;color:var(--g2)}
@media(max-width:520px){footer{letter-spacing:.2em}.word{letter-spacing:.24em;padding-left:.24em}}
@media(min-width:1200px){.word{font-size:clamp(4.4rem,6.4vw,8.4rem)}.symwrap{width:min(508px,29vw)}.tag{font-size:clamp(1rem,1.15vw,1.4rem)}.soon{font-size:.95rem}.sub{font-size:1.1rem;max-width:520px}footer{font-size:.78rem}}

/* ===== entrada: pulsa uma vez e dá zoom brilhando ===== */
html.lock,html.lock body{overflow:hidden}
#sp{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .8s ease,visibility 0s}
#sp.gone{opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s .8s}
#sp .spl{will-change:transform,opacity;display:block;width:min(376px,78vw);height:auto;overflow:visible;opacity:0;transform:scale(.85);animation:spin .5s .1s ease-out forwards,spbeat .85s ease-in-out .6s 1}
.spr{position:absolute;left:50%;top:50%;width:min(190px,38vw);aspect-ratio:1;margin:calc(min(190px,38vw)/-2) 0 0 calc(min(190px,38vw)/-2);border-radius:50%;border:1px solid rgba(243,217,164,.65);opacity:0;animation:spring .85s ease-out .65s 1}
@keyframes spin{to{opacity:1;transform:scale(1)}}
@keyframes spbeat{0%{transform:scale(1)}16%{transform:scale(1.1)}32%{transform:scale(1)}48%{transform:scale(1.05)}70%,100%{transform:scale(1)}}
@keyframes spring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
#sp.out{pointer-events:none}
#sp.out .spl{transform:scale(1);opacity:1;animation:spout .7s ease-in forwards}
#sp.out .spr{display:none}
@keyframes spout{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
body:not(.go) :is(main,footer,.curves),body:not(.go) :is(main,footer,.curves) *,body:not(.go) :is(main,footer,.curves) *::before,body:not(.go) :is(main,footer,.curves) *::after{animation-play-state:paused!important}
.symbox .lg0{opacity:0;animation:in .8s ease-in .1s forwards}.curves{opacity:0;animation:in 2s 1.4s forwards;will-change:opacity}.curves path{animation:none!important;opacity:.75}
#dr{will-change:transform;contain:paint}
