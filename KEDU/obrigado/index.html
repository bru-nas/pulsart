<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagamento recebido · K.Edu</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--ink:#0B1740;--blue:#173A8A;--amber:#FFBF24;--paper:#F5F8FF;--line:#DCE4F5;--mute:#52608A;--ok:#16A34A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0B1F57 0%,#173A8A 100%);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;padding:20px max(20px,env(safe-area-inset-right)) 20px max(20px,env(safe-area-inset-left))}
.card{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:34px 28px;text-align:center;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.ck{width:64px;height:64px;border-radius:50%;background:#ECFDF3;color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.ck svg{width:34px;height:34px}
h1{font:700 clamp(24px,6vw,30px)/1.15 Outfit,sans-serif;margin:0 0 8px}
p{margin:0 0 6px;color:var(--mute)}
ol{text-align:left;margin:18px auto 0;padding-left:22px;color:var(--ink);max-width:380px}
ol li{margin:6px 0}
button{width:100%;margin-top:22px;padding:17px;border:0;border-radius:99px;background:var(--amber);color:var(--ink);font:700 18px Outfit,sans-serif;cursor:pointer;box-shadow:0 8px 24px -10px rgba(232,164,0,.9);transition:background .2s,color .2s}
button:hover{background:var(--blue);color:#fff}
small{display:block;margin-top:14px;color:var(--mute)}
</style>
</head>
<body>
<main class="card">
  <div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
  <h1>Pagamento recebido!</h1>
  <p>Sua licença do K.Edu é liberada sozinha assim que o pagamento é confirmado.</p>
  <ol>
    <li>Clique no botão abaixo para baixar o K.Edu.</li>
    <li>Abra o SIAP e clique no ícone do K.Edu.</li>
    <li>Entre com o e-mail e a senha que você criou.</li>
  </ol>
  <button type="button" id="baixar">Baixar o K.Edu</button>
  <small>Dúvidas? WhatsApp (62) 99669-0398</small>
</main>
<script>
document.getElementById('baixar').onclick=function(){window.open('https://chromewebstore.google.com/detail/mcbpphlllbiceebaoceplaiejjbcopoe','_blank','noopener')};
</script>
</body>
</html>
