<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PULSART Manager</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PULSART"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--g1:#f3d9a4;--g2:#c9a063;--g3:#8c6a36;--l:rgba(201,160,99,.28);--t:#e9dcc3;--m:#a99a7c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:var(--t);font:300 16px/1.6 'Jost',system-ui,sans-serif;min-height:100svh;overflow-x:hidden;padding:0 16px calc(60px + env(safe-area-inset-bottom))}
.hide{display:none!important}
.bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bgc path{fill:none;stroke:url(#gg);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.4}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto}
/* ===== abertura PULSART (igual à do site) ===== */
html.lock,html.lock body{overflow:hidden}
#sp{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;cursor:pointer}
#sp .spl{will-change:transform,opacity;display:block;width:min(376px,78vw);height:auto;opacity:0;transform:scale(.85);animation:spin .5s .1s ease-out forwards,spbeat .85s ease-in-out .6s 1}
.spr{position:absolute;left:50%;top:50%;width:min(190px,38vw);aspect-ratio:1;margin:calc(min(190px,38vw)/-2) 0 0 calc(min(190px,38vw)/-2);border-radius:50%;border:1px solid rgba(243,217,164,.65);opacity:0;animation:spring .85s ease-out .65s 1}
@keyframes spin{to{opacity:1;transform:scale(1)}}
@keyframes spbeat{0%{transform:scale(1)}16%{transform:scale(1.1)}32%{transform:scale(1)}48%{transform:scale(1.05)}70%,100%{transform:scale(1)}}
@keyframes spring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
#sp.out{pointer-events:none;opacity:0;transition:opacity .8s ease .2s}
#sp.out .spl{opacity:1;animation:none;transform:scale(1)}
#sp.out .spr{display:none}
@keyframes inn{to{opacity:1}}

header{padding:calc(26px + env(safe-area-inset-top)) 0 4px;text-align:center}
.symwrap{width:min(300px,72vw);margin:-14px auto -30px;pointer-events:none}
.symbox{position:relative;width:100%}.symbox .lg0{display:block;width:100%;height:auto;opacity:0;animation:inn .8s ease-in .1s forwards}.symbox svg{display:block;width:100%;height:auto;overflow:visible}
#dr{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;contain:paint}
.lgo{display:inline-block;font-weight:300;font-size:clamp(1.9rem,9vw,2.6rem);letter-spacing:.34em;padding:4px 0 4px .34em;line-height:1;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;-webkit-user-select:none;white-space:nowrap}
.mg{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 0;color:var(--g2);font-size:.72rem;letter-spacing:.6em;padding-left:.6em;text-transform:uppercase}
.mg i{flex:0 0 clamp(26px,12vw,54px);height:1px;background:linear-gradient(90deg,transparent,var(--g2))}.mg i:last-child{transform:scaleX(-1)}
/* ===== entrar ===== */
#lg{max-width:340px;margin:30px auto 0;text-align:center}
input{width:100%;background:#000;border:1px solid var(--l);border-radius:12px;color:var(--t);font:300 1rem 'Jost',sans-serif;padding:15px 16px;outline:none;letter-spacing:.06em}
#pw{text-align:center}
input:focus{border-color:var(--g2)}
.btn{width:100%;border:0;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#1a1206;font:500 .88rem 'Jost',system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;padding:17px;cursor:pointer;margin-top:12px;box-shadow:0 8px 30px rgba(201,160,99,.22)}
.btn:disabled{opacity:.5}
.er{color:#ff9a9a;font-size:.86rem;min-height:1.3em;margin-top:10px}
/* ===== painel ===== */
.tb{display:flex;align-items:center;gap:6px;margin:22px 0 16px;border-bottom:1px solid var(--l);padding-bottom:12px}
.tb .sp{flex:1}
.tab{font:400 .74rem 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--m);background:none;border:0;border-bottom:2px solid transparent;padding:8px 2px;margin-right:6px;cursor:pointer}
.tab.on{color:var(--g1);border-bottom-color:var(--g2)}
.ib{font:400 .66rem 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--g1);background:none;border:1px solid var(--l);border-radius:999px;padding:9px 11px;cursor:pointer}
.card{background:linear-gradient(180deg,rgba(18,15,10,.92),rgba(8,7,5,.92));border:1px solid var(--l);border-radius:16px;padding:18px;margin:0 0 14px}
.card h2{font-weight:400;font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;margin:0 0 8px;color:var(--g1)}
.card p{margin:0 0 10px;color:var(--m);font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ok{color:#9fe0a8}
.cl h3{margin:0 0 2px;font-weight:400;font-size:1.1rem;color:var(--g1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cl .nv{font:500 .6rem 'Jost',sans-serif;letter-spacing:.2em;background:linear-gradient(135deg,var(--g1),var(--g3));color:#1a1206;border-radius:999px;padding:3px 9px}
.cl .meta{color:var(--m);font-size:.82rem;margin:0 0 8px}
.cl .txt{white-space:pre-wrap;word-break:break-word;color:#cdbf9f;font-size:.9rem;margin:6px 0 10px;border-left:2px solid var(--l);padding-left:12px}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fl button,.fl a{font:300 .8rem 'Jost',sans-serif;padding:8px 12px;border-radius:999px;border:1px solid var(--l);background:#000;color:var(--g1);cursor:pointer;text-decoration:none;display:inline-block}
.fl .red{border-color:#8b1a2b;color:#ff9a9a}
.fl .wa{border-color:rgba(159,224,168,.45);color:#9fe0a8}
.vz{text-align:center;color:var(--m);padding:36px 10px;font-size:.95rem}
/* atalhos */
.at{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.at a,.at .add{display:flex;flex-direction:column;justify-content:center;min-height:78px;padding:14px;border:1px solid var(--l);border-radius:14px;background:linear-gradient(180deg,rgba(18,15,10,.92),rgba(8,7,5,.92));color:var(--g1);text-decoration:none;position:relative}
.at a b{font-weight:400;font-size:.95rem;letter-spacing:.04em}.at a span{color:var(--m);font-size:.72rem;letter-spacing:.06em;margin-top:2px;word-break:break-all}
.at .add{cursor:pointer;align-items:center;color:var(--g2);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;border-style:dashed;background:none;font-family:inherit;font-weight:300}
.at a .x{position:absolute;top:6px;right:8px;color:#a06a6a;font-size:1rem;line-height:1;padding:2px 4px}
.nl{display:grid;gap:8px;margin-top:12px}
.sec{font-weight:400;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--g2);margin:20px 0 10px}
.ft{text-align:center;color:#6f6450;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;margin-top:26px}
</style></head><body>

function tela(n){$('lg').classList.toggle('hide',n!=='lg');$('mn').classList.toggle('hide',n!=='mn')}

/* abas */
function aba(n){$('pb').classList.toggle('hide',n!==1);$('pa').classList.toggle('hide',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);$('rf').classList.toggle('hide',n!==1)}
$('t1').onclick=function(){aba(1)};$('t2').onclick=function(){aba(2);atalhos()};

/* entrar / sair */
$('fl').addEventListener('submit',function(e){e.preventDefault();var v=$('pw').value;if(!v)return;K=v;$('en').disabled=true;$('le').textContent='';carregar(true)});
$('sr').onclick=function(){K='';try{localStorage.removeItem('pm_k')}catch(e){}$('pw').value='';$('ls').innerHTML='';tela('lg')};
$('rf').onclick=function(){carregar(true)};

/* briefings */
var busy=false;
function carregar(manual){if(busy)return;busy=true;
 jf(API+'/api/admin/list',{headers:H()}).then(function(j){busy=false;try{localStorage.setItem('pm_k',K)}catch(e){}tela('mn');$('en').disabled=false;render(j.itens||[]);avisos()})
 .catch(function(er){busy=false;$('en').disabled=false;if(er.st===401){K='';try{localStorage.removeItem('pm_k')}catch(e){}tela('lg');$('le').textContent='Senha incorreta.'}
  else if($('mn').classList.contains('hide')){tela('lg');$('le').textContent='Sem conexão. Tente de novo.'}
  else if(manual){var o=$('ls');if(!o.querySelector('.er'))o.insertAdjacentHTML('afterbegin','<div class="er">Não foi possível atualizar agora.</div>')}})}
function zapLink(z){var d=String(z||'').replace(/\D/g,'');if(d.length<10)return '';if(d.length<=11)d='55'+d;return 'https://wa.me/'+d}
function render(it){var c=$('ls');c.innerHTML='';
 if(!it.length){c.innerHTML='<div class="vz">Nenhum briefing por enquanto.</div>';return}
 it.forEach(function(x){var d=x.data||{},el=document.createElement('div');el.className='card cl';
  var novo=d.criado&&(Date.now()-new Date(d.criado).getTime())<864e5;
  var h='<h3>'+esc(d.nome||'(envio incompleto)')+(novo?'<span class="nv">NOVO</span>':'')+'</h3><div class="meta">'+esc(d.criado?new Date(d.criado).toLocaleString('pt-BR'):'Envio não concluído')+' · '+x.arqs.length+' arquivo(s) · '+fmt(x.bytes)+'</div>';
  if(d.nome)h+='<div class="txt">'+esc('WhatsApp: '+d.zap+(d.insta?'\nInstagram: '+d.insta:'')+'\nEstilo: '+(d.tema||'não sabe')+'\n\n'+d.desc+(d.formatos?'\n\nFormatos:\n'+d.formatos:'')+(d.yt&&d.yt.length?'\n\nYouTube:\n'+d.yt.join('\n'):'')+(d.spotify&&d.spotify.length?'\n\nSpotify:\n'+[].concat(d.spotify).join('\n'):'')+(d.redes?'\n\nRedes: '+d.redes:''))+'</div>';
  h+='<div class="fl" data-f></div><div class="fl" data-a></div>';el.innerHTML=h;
  var f=el.querySelector('[data-f]'),a=el.querySelector('[data-a]');
  x.arqs.forEach(function(q){var b=document.createElement('button'),nm=q.nome.replace(/^(foto|video|logo|audio)-\d+-/,'$1-');b.textContent='⬇ '+nm.replace(/^(foto|video|logo|audio)-/,'$1 · ')+' ('+fmt(q.size)+')';
   b.onclick=function(){b.textContent='Baixando...';fetch(API+'/api/admin/file?key='+encodeURIComponent(q.key),{headers:H()}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(bl){var u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=nm;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);b.textContent='✓ '+nm}).catch(function(){b.textContent='Erro, tente de novo'})};f.appendChild(b)});
  if(d.nome){var cb=document.createElement('button');cb.textContent='Copiar texto';cb.onclick=function(){var t='Nome artístico: '+d.nome+'\nInstagram: '+d.insta+'\nWhatsApp: '+d.zap+'\nEstilo: '+d.tema+'\n\nDescrição:\n'+d.desc+(d.formatos?'\n\nFormatos:\n'+d.formatos:'')+(d.yt&&d.yt.length?'\n\nYouTube:\n'+d.yt.join('\n'):'')+(d.spotify&&d.spotify.length?'\n\nSpotify:\n'+[].concat(d.spotify).join('\n'):'')+(d.redes?'\n\nRedes: '+d.redes:'');if(navigator.clipboard)navigator.clipboard.writeText(t);cb.textContent='Copiado ✓'};a.appendChild(cb);
   var zl=zapLink(d.zap);if(zl){var w=document.createElement('a');w.className='wa';w.href=zl;w.target='_blank';w.rel='noopener';w.textContent='Chamar no WhatsApp';a.appendChild(w)}}
  var del=document.createElement('button');del.className='red';del.textContent='Apagar tudo deste cliente';var arm=0;
  del.onclick=function(){if(!arm){arm=1;del.textContent='Toque de novo para APAGAR de vez';setTimeout(function(){arm=0;del.textContent='Apagar tudo deste cliente'},4000);return}
   del.textContent='Apagando...';jf(API+'/api/admin/del?id='+x.id,{method:'DELETE',headers:H()}).then(function(){el.remove();if(!$('ls').querySelector('.cl'))render([])}).catch(function(){del.textContent='Erro ao apagar'})};
  a.appendChild(del);c.appendChild(el)})}
setInterval(function(){if(!document.hidden&&!$('mn').classList.contains('hide')&&!$('pb').classList.contains('hide'))carregar()},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&K&&!$('mn').classList.contains('hide')&&!$('pb').classList.contains('hide'))carregar()});

/* atalhos (fixos + os que você adicionar) */
var FIXOS=[['Site PULSART','https://pulsart.com.br/'],['Estilos','https://pulsart.com.br/ESTILOS/'],['Briefing','https://pulsart.com.br/BRIEFING/'],['WhatsApp PULSART','https://wa.me/5562996690398'],['Bruna e Miztella','https://pulsart.com.br/BRUNAEMIZTELLA/'],['MAMEDE','https://pulsart.com.br/MAMEDE/'],['Novo Clipe','https://pulsart.com.br/NOVOCLIPE/'],['Wesley Busquini','https://pulsart.com.br/BUSQUINI/'],['Mateus Tavares','https://pulsart.com.br/MATEUSTAVARES/'],['Thiago Diniz','https://pulsart.com.br/THIAGODINIZ/'],['Tia Zicca','https://pulsart.com.br/TIAZICCA/'],['Cloudflare','https://dash.cloudflare.com/'],['GitHub','https://github.com/bru-nas/pulsart']];
function meus(){try{return JSON.parse(localStorage.getItem('pm_links')||'[]')}catch(e){return[]}}
function salvaMeus(a){try{localStorage.setItem('pm_links',JSON.stringify(a))}catch(e){}}
function host(u){try{return new URL(u).host.replace(/^www\./,'')+new URL(u).pathname.replace(/\/$/,'')}catch(e){return u}}
function atalhos(){var c=$('atl');c.innerHTML='';
 FIXOS.forEach(function(l){var a=document.createElement('a');a.href=l[1];a.target='_blank';a.rel='noopener';a.innerHTML='<b>'+esc(l[0])+'</b><span>'+esc(host(l[1]))+'</span>';c.appendChild(a)});
 meus().forEach(function(l,i){var a=document.createElement('a');a.href=l.u;a.target='_blank';a.rel='noopener';a.innerHTML='<b>'+esc(l.n)+'</b><span>'+esc(host(l.u))+'</span><i class="x" title="Remover">×</i>';
  a.querySelector('.x').onclick=function(e){e.preventDefault();e.stopPropagation();var m=meus();m.splice(i,1);salvaMeus(m);atalhos()};c.appendChild(a)});
 var b=document.createElement('button');b.type='button';b.className='add';b.textContent='+ Adicionar';b.onclick=function(){$('nl').classList.remove('hide');$('nn').focus()};c.appendChild(b)}
$('ncn').onclick=function(){$('nl').classList.add('hide');$('ne').textContent=''};
$('nsv').onclick=function(){var n=$('nn').value.trim(),u=$('nu').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
 if(!n||!/^https?:\/\/[^\s.]+\.[^\s]+/i.test(u)){$('ne').textContent='Informe o nome e um endereço válido.';return}
 var m=meus();m.push({n:n.slice(0,40),u:u});salvaMeus(m);$('nn').value='';$('nu').value='';$('ne').textContent='';$('nl').classList.add('hide');atalhos()};

/* avisos (push) */
var reg=null;
function regSW(){if(!('serviceWorker' in navigator))return Promise.resolve(null);return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(r){reg=r;return r}).catch(function(){return null})}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.novo&&K&&!$('mn').classList.contains('hide'))carregar()});
var swp=regSW();
function suportado(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window)}
function avisos(){var s=$('avs'),on=$('avon'),t=$('avt'),off=$('avoff');
 if(!suportado()){s.textContent='Avisos indisponíveis neste navegador.';on.classList.add('hide');return}
 if(Notification.permission==='denied'){s.textContent='Avisos bloqueados nas configurações do navegador.';on.classList.add('hide');return}
 swp.then(function(r){if(!r){s.textContent='Avisos indisponíveis neste navegador.';on.classList.add('hide');return}return r.pushManager.getSubscription().then(function(sub){
  if(sub&&Notification.permission==='granted'){s.innerHTML='<span class="ok">✓ Ativados neste aparelho.</span>';on.classList.add('hide');t.classList.remove('hide');off.classList.remove('hide');
   jf(API+'/api/admin/push/sub',{method:'POST',headers:Object.assign({'content-type':'application/json'},H()),body:JSON.stringify({sub:sub.toJSON()})}).catch(function(){})}
  else{s.textContent='Desativados neste aparelho.';on.classList.remove('hide');t.classList.add('hide');off.classList.add('hide')}})})}
$('avon').onclick=function(){var b=this;b.disabled=true;
 Notification.requestPermission().then(function(p){if(p!=='granted'){b.disabled=false;avisos();return}
  return swp.then(function(r){return jf(API+'/api/push/key').then(function(k){var key=ub64(k.key);
   return r.pushManager.getSubscription().then(function(old){
    if(old){var ok=old.options&&old.options.applicationServerKey&&new Uint8Array(old.options.applicationServerKey).join()===key.join();if(ok)return old;return old.unsubscribe().then(function(){return null})}return null})
   .then(function(sub){return sub||r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key})})})})
  .then(function(sub){return jf(API+'/api/admin/push/sub',{method:'POST',headers:Object.assign({'content-type':'application/json'},H()),body:JSON.stringify({sub:sub.toJSON()})})})
  .then(function(){b.disabled=false;avisos()})})
 .catch(function(){b.disabled=false;$('avs').textContent='Não foi possível ativar agora. Tente de novo.'})};
$('avt').onclick=function(){var b=this;b.textContent='Enviando...';jf(API+'/api/admin/push/test',{method:'POST',headers:H()}).then(function(j){b.textContent=j.n?'Aviso enviado ✓':'Nenhum aparelho ativo';setTimeout(function(){b.textContent='Testar aviso'},3000)}).catch(function(){b.textContent='Erro, tente de novo'})};
$('avoff').onclick=function(){swp.then(function(r){return r.pushManager.getSubscription()}).then(function(sub){if(!sub)return;var ep=sub.endpoint;return jf(API+'/api/admin/push/unsub',{method:'POST',headers:Object.assign({'content-type':'application/json'},H()),body:JSON.stringify({endpoint:ep})}).catch(function(){}).then(function(){return sub.unsubscribe()})}).then(avisos)};

/* instalar na tela inicial */
var dp=null,standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;if(!standalone)$('insb').classList.remove('hide')});
$('insb').onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;$('insb').classList.add('hide')})};
window.addEventListener('appinstalled',function(){$('insb').classList.add('hide')});

/* início */
aba(1);if(K)carregar();else tela('lg');
})();
